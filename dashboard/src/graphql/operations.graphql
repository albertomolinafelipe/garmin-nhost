query ActivitiesSmoke {
  activities(order_by: {start_time: desc_nulls_last}, limit: 25) {
    id
    garmin_activity_id
    name
    activity_type
    subtype
    start_time
    duration_s
    distance_m
  }
}

query CalendarActivities {
  activities(order_by: {start_time: desc_nulls_last}) {
    id
    name
    activity_type
    subtype
    start_time
    duration_s
    distance_m
    elevation_gain_m
    feeling
    effort
    caffeine
    focus
  }
}

query ActivityDetail($id: bigint!) {
  activities_by_pk(id: $id) {
    id
    garmin_activity_id
    name
    activity_type
    subtype
    start_time
    duration_s
    distance_m
    elevation_gain_m
    avg_hr
    max_hr
    calories
    avg_speed_mps
    avg_power_w
    feeling
    effort
    food_during
    food_after
    caffeine
    weather
    notes
    focus
    hard_tries
    strength_exercises
    activity_streams {
      payload
    }
  }
}

mutation UpdateActivity($id: bigint!, $set: activities_set_input!) {
  update_activities_by_pk(pk_columns: {id: $id}, _set: $set) {
    id
    name
    subtype
    feeling
    effort
    food_during
    food_after
    caffeine
    weather
    notes
    focus
    hard_tries
    strength_exercises
  }
}

query FoodOptions {
  food_options(order_by: {value: asc}) {
    value
  }
}

query Exercises {
  exercises(order_by: {name: asc}) {
    id
    name
    categories
  }
}

mutation InsertExercise($name: String!, $categories: [String!]!) {
  insert_exercises_one(object: {name: $name, categories: $categories}) {
    id
    name
    categories
  }
}

mutation UpdateExercise($id: bigint!, $set: exercises_set_input!) {
  update_exercises_by_pk(pk_columns: {id: $id}, _set: $set) {
    id
    name
    categories
  }
}

mutation DeleteExercise($id: bigint!) {
  delete_exercises_by_pk(id: $id) {
    id
  }
}

query Plans {
  plans(order_by: {start_week: desc}) {
    id
    name
    start_week
    end_week
    notes
  }
}

query Races {
  races(order_by: {date: desc}) {
    id
    date
    name
    distance_m
    elevation_gain_m
  }
}

mutation InsertRace($object: races_insert_input!) {
  insert_races_one(object: $object) {
    id
  }
}

mutation UpdateRace($id: bigint!, $set: races_set_input!) {
  update_races_by_pk(pk_columns: {id: $id}, _set: $set) {
    id
  }
}

mutation DeleteRace($id: bigint!) {
  delete_races_by_pk(id: $id) {
    id
  }
}

query Plan($id: bigint!) {
  plans_by_pk(id: $id) {
    id
    name
    start_week
    end_week
    notes
    requirements(order_by: {week: asc}) {
      id
      week
      sport
      metric
      target
      notes
    }
    workouts(order_by: {week: asc}) {
      id
      week
      day_of_week
      sport
      title
      description
    }
  }
}

mutation InsertPlan($object: plans_insert_input!) {
  insert_plans_one(object: $object) {
    id
  }
}

mutation UpdatePlan($id: bigint!, $set: plans_set_input!) {
  update_plans_by_pk(pk_columns: {id: $id}, _set: $set) {
    id
  }
}

mutation DeletePlan($id: bigint!) {
  delete_plans_by_pk(id: $id) {
    id
  }
}

mutation InsertPlanRequirement($object: plan_requirements_insert_input!) {
  insert_plan_requirements_one(object: $object) {
    id
  }
}

mutation UpdatePlanRequirement($id: bigint!, $set: plan_requirements_set_input!) {
  update_plan_requirements_by_pk(pk_columns: {id: $id}, _set: $set) {
    id
  }
}

mutation DeletePlanRequirement($id: bigint!) {
  delete_plan_requirements_by_pk(id: $id) {
    id
  }
}

query AllPlanRequirements {
  plan_requirements(order_by: {week: asc}) {
    id
    week
    sport
    metric
    target
  }
}

query AllPlanWorkouts {
  plan_workouts(order_by: {week: asc}) {
    id
    plan_id
    week
    day_of_week
    sport
    title
    description
    completed_at
  }
}

mutation InsertPlanWorkout($object: plan_workouts_insert_input!) {
  insert_plan_workouts_one(object: $object) {
    id
  }
}

mutation UpdatePlanWorkout($id: bigint!, $set: plan_workouts_set_input!) {
  update_plan_workouts_by_pk(pk_columns: {id: $id}, _set: $set) {
    id
  }
}

mutation DeletePlanWorkout($id: bigint!) {
  delete_plan_workouts_by_pk(id: $id) {
    id
  }
}

mutation SyncActivities($days: Int = 7, $maxActivities: Int = 20) {
  syncActivities(days: $days, maxActivities: $maxActivities) {
    activities_created
    activities_updated
    sleep_created
    sleep_updated
    streams_written
    activities_failed
    errors
  }
}
